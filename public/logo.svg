<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Platinum / Silver Linear Gradient -->
    <linearGradient id="metallic-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B626E" />
      <stop offset="25%" stop-color="#BCCBD1" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#9FB2BC" />
      <stop offset="85%" stop-color="#556E7B" />
      <stop offset="100%" stop-color="#2D414C" />
    </linearGradient>

    <!-- Bevel Light Highlight -->
    <linearGradient id="bevel-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7B93A0" stop-opacity="0.2" />
    </linearGradient>

    <!-- Inner Dark Metal Shadow -->
    <linearGradient id="metal-shadow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1A2830" />
      <stop offset="100%" stop-color="#566C77" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logo-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-color="#1A2B35" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Group for Logo Mark with Shadow -->
  <g filter="url(#logo-drop-shadow)">

    <!-- Digit 4 -->
    <path d="M 195,125 L 140,205 L 195,205 L 195,225 L 215,225 L 215,205 L 230,205 L 230,187 L 215,187 L 215,125 Z M 195,148 L 195,187 L 168,187 Z" fill="url(#metallic-silver)" stroke="#394D58" stroke-width="1.5" />

    <!-- Letter D Outer Loop -->
    <path d="M 225,125 L 265,125 C 315,125 345,150 345,175 C 345,200 315,225 265,225 L 225,225 Z" fill="url(#metallic-silver)" stroke="#394D58" stroke-width="1.5" />

    <!-- Letter D Inner Counter Hole -->
    <path d="M 245,142 L 265,142 C 295,142 322,158 322,175 C 322,192 295,208 265,208 L 245,208 Z" fill="#FFFFFF" />

    <!-- Film Reel Assembly (Center of D) -->
    <g transform="translate(275, 175)">
      <!-- Outer Reel Rim -->
      <circle r="44" fill="url(#metallic-silver)" stroke="#2D414C" stroke-width="2" />
      <circle r="40" fill="url(#metal-shadow)" />
      <circle r="38" fill="url(#metallic-silver)" />

      <!-- Film Reel Inner Rim -->
      <circle r="27" fill="#203038" />

      <!-- 6 Circular Film Reel Holes -->
      <circle cx="0" cy="-17" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />
      <circle cx="14.7" cy="-8.5" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />
      <circle cx="14.7" cy="8.5" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />
      <circle cx="0" cy="17" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />
      <circle cx="-14.7" cy="8.5" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />
      <circle cx="-14.7" cy="-8.5" r="7" fill="#EBF2F5" stroke="#4B626E" stroke-width="1" />

      <!-- Center Hub -->
      <circle r="10" fill="url(#metallic-silver)" stroke="#1A2830" stroke-width="1" />
      <circle r="5" fill="#1A2830" />
      <circle r="2" fill="#FFFFFF" />
    </g>

  </g>

  <!-- Typography: FOUR DEE -->
  <text x="250" y="275" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', 'Playfair Display', serif" font-weight="700" font-size="34" fill="#334752" letter-spacing="9">FOUR DEE</text>

  <!-- Typography: MOTION PICTURES -->
  <text x="250" y="302" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', sans-serif" font-weight="600" font-size="14" fill="#4B626E" letter-spacing="11">MOTION PICTURES</text>
</svg>
